<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>저장 폴더 선택 · cheese-clip</title>
  <link rel="stylesheet" href="folder.css">
</head>
<body>
  <main>
    <h1 id="title">기본 저장 폴더 선택</h1>
    <p class="lead" id="lead">WebP와 영상을 저장할 폴더를 고릅니다. 안에 스트리머별 폴더가 만들어집니다.</p>

    <section class="card">
      <div class="label">현재 저장 폴더</div>
      <div class="current" id="current">선택된 폴더 없음</div>
      <div class="state" id="state"></div>
      <div class="buttons">
        <button id="pick" type="button" class="primary">폴더 선택…</button>
        <button id="grant" type="button" hidden>권한 다시 허용</button>
        <button id="clear" type="button" hidden>선택 해제</button>
      </div>
    </section>

    <section class="tips">
      <h2>참고</h2>
      <ul>
                <li>드라이브 맨 위(<code>C:\</code>), 사용자 폴더 자체, 윈도우 폴더는 고를 수 없습니다. 그 안에 새 폴더를 만들어 고르십시오.</li>
        <li>크롬을 다시 켜면 <b>권한 다시 허용</b>이 필요할 수 있습니다. "방문할 때마다 허용"을 고르면 묻지 않습니다.</li>
        <li>권한이 없으면 <b>다운로드/cheese-clip</b>에 대신 저장됩니다.</li>
      </ul>
    </section>
    <p class="done" id="done" aria-live="polite"></p>
  </main>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/channels.js"></script>
  <script src="../shared/handle-store.js"></script>
  <script src="folder.js"></script>
</body>
</html>
